message TestingMessage {
  string id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
  float scale = 5;
  optional uint32 color = 6;
}

message RequestFullState {
  uint64 index = 1;
}

message MyChatMessage {
  bool is_group = 1;
  string message = 2;
}

message ChatMessage {
  string id = 1;
  optional string username = 2;
  optional string clan_tag = 3;
  string message = 4;
  bool is_group = 5;
  uint32 messageType = 6;

  optional float top_leaderboard_importance = 7;
}

message MyFiringMessage {
  float x = 1;
  float y = 2;
  float z = 3;
  float direction_x = 4;
  float direction_y = 5;
  float direction_z = 6;
  uint32 cannon_ball_type = 7;
  uint64 id = 8;

  optional uint64 relative_to_id = 9;
}

message CannonBallMessage {
  float x = 1;
  float y = 2;
  float z = 3;
  float velocity_x = 4;
  float velocity_y = 5;
  float velocity_z = 6;
  uint32 cannon_ball_type = 7;
  uint64 id = 8;
  uint64 fired_by_id = 9;
