  double steering = 6;
  double sail_power = 7;
  double sail_rotation = 8;
}

message PersistedItemMessage {
  uint32 item_type = 1;
  PersistedPlacementMessage placement = 2;
  double scale = 3;
  uint32 skin = 4;
  bool ever_carried = 5;
  string origin_island = 6;
  double origin_x = 7;
  double origin_y = 8;
  double origin_z = 9;
  double cargo_points = 10;
  uint64 id = 11;
}

message PersistedStateMessage {
  repeated PersistedPlayerMessage players = 1;
  repeated PersistedShipMessage ships = 2;
  repeated PersistedItemMessage items = 3;
}

message SelectSkinMessage {
  uint32 selected_skin = 1;
  uint32 character_mesh = 2;
}

message SkinSelectedMessage {
  uint32 selected_skin = 1;
  uint32 character_mesh = 2;
}

message SelectShipMessage {
  uint32 ship_type = 1;
}

message ShipSelectedMessage {
  uint32 ship_type = 1;
}

message FlushStatsMessage {
  bool foo = 1;
}

message TutorialsSeenMessage {
  bool steering = 1;
  bool sail_power = 2;
  bool cannons = 3;
  bool raft_sails = 4;
  bool raft_steering = 5;
  bool rowing = 6;
  bool items_and_trading = 7;
  bool map = 8;

  uint32 instructions_arrow_shown = 9;
}

message MedalEntry {
  int32 medal_type = 1;
  int64 count = 2;
}

message GetMedalsRequest {
  bool foo = 1;
}

message MedalsResponse {
  repeated MedalEntry medals = 1;
}

message GetPlayerMedalsRequest {
  string gid = 1;
}

message PlayerMedalsResponse {
  string gid = 1;
  string username = 2;
  repeated MedalEntry medals = 3;
}

message FishingReelMessage {
  bool reeling = 1;

  bool cancel = 2;
}

message PlaceGroupFlagMessage {
  bool foo = 1;
}

enum CrewAction {
  CrewGetOpenCrews = 0;
  CrewGetMyCrew = 1;
  CrewRequestJoin = 2;
  CrewAcceptJoin = 3;
  CrewLeave = 4;
  CrewTransferLeadership = 5;
  CrewKick = 6;
}

message CrewRequest {
  CrewAction action = 1;
  optional string target_gid = 2;
}

message CrewShip {
  uint32 ship_type = 1;
  uint32 cannon_count = 2;
}

message OpenCrew {
  string leader_gid = 1;
  string leader_username = 2;
  optional string leader_clan_tag = 3;
  uint32 member_count = 4;
  optional CrewShip ship = 5;
}

message OpenCrewsResponse {
  repeated OpenCrew crews = 1;
}

message CrewMember {
  string gid = 1;
  string username = 2;
  optional string clan_tag = 3;
  bool is_leader = 4;
}

message MyCrewResponse {
  uint64 group_id = 1;
  string leader_gid = 2;
  repeated CrewMember members = 3;
  optional CrewShip ship = 4;

  string invite_token = 5;
}

message CrewJoinRequestMessage {
  string requester_gid = 1;
  string requester_username = 2;
}
