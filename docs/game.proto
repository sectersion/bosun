}

message MyTankMessage {
  uint64 id = 1;
  optional string username = 2;
  optional float x = 3;
  optional float y = 4;
  optional float z = 5;
  optional float rotation_x = 6;
  optional float rotation_y = 7;
  optional float rotation_z = 8;
