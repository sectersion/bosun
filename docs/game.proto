  string name = 1;
  float x = 2;
  float y = 3;
  float z = 4;
}

message MyChangingDetails {
  optional float gold = 1;
  optional uint32 wanted_time = 2;
  optional bool is_firing_from_water = 3;
  optional float hunger = 4;
